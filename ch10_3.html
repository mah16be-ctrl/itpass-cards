<style>
:root{--bg:#f6f8f3;--card:#fff;--tx:#1f2a1f;--sub:#5d6b5d;--g:#2e7d32;--gl:#e4f1d8;--bd:#d5dccf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a14;--card:#1f281f;--tx:#e8efe5;--sub:#a3b1a0;--g:#7bc67e;--gl:#2a3d2a;--bd:#344034}}
:root[data-theme="dark"]{--bg:#141a14;--card:#1f281f;--tx:#e8efe5;--sub:#a3b1a0;--g:#7bc67e;--gl:#2a3d2a;--bd:#344034}
html,body{height:100%;margin:0}html{height:100dvh}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:12px 16px;box-sizing:border-box}
h1{font-size:15px;margin:0 0 8px;color:var(--sub);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
button{touch-action:manipulation;font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;min-height:40px}
button.on{background:var(--g);color:#fff;border-color:var(--g)}
.info{font-size:14px;color:var(--sub);margin:2px 0 6px}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--g);transition:width .3s}
#card{touch-action:manipulation;flex:1;background:var(--card);border:1px solid var(--bd);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;cursor:pointer;user-select:none;min-height:0}
#card.vip{background:var(--gl);border-color:var(--g)}
.badge{font-size:12px;background:var(--g);color:#fff;border-radius:999px;padding:2px 10px;margin-bottom:14px}
#t{font-size:clamp(24px,7vw,40px);font-weight:700;line-height:1.4;word-break:break-word}
#d{font-size:clamp(17px,4.6vw,26px);line-height:1.7}
.hint{font-size:12px;color:var(--sub);margin-top:16px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ctl button{border-radius:14px;min-height:52px;font-size:16px}
#ok{grid-column:1/-1;border:2px solid var(--g);color:var(--g);font-weight:700}
#ok.on{background:var(--g);color:#fff}
#ok:disabled{opacity:.4}
@media(min-width:700px){body{max-width:760px;padding:24px}h1{font-size:18px}.ctl{grid-template-columns:repeat(3,1fr)}#ok{grid-column:auto;order:2}#pv{order:1}#nx{order:3}.ctl button{min-height:60px;font-size:18px}#card{padding:40px}}
@media(max-height:520px) and (orientation:landscape){body{max-width:none;padding-top:6px;padding-bottom:6px}h1{display:none}#card{padding:12px}.badge{margin-bottom:6px}.ctl{grid-template-columns:repeat(3,1fr);margin-top:6px}#ok{grid-column:auto;order:2}#pv{order:1}#nx{order:3}.ctl button{min-height:44px}}
.rs{display:block;margin:6px auto 0;background:none;border:none;color:var(--sub);font-size:13px;text-decoration:underline;min-height:36px;padding:4px 10px}
#t,#d,.hint{white-space:pre-line}
</style></head><body>
<h1>ITパスポート 第10章-3（ストラテジ系）</h1>
<div class="row" id="fs"><button data-f="all" class="on">すべて</button><button data-f="vip">超重要</button><button id="sv">「覚えた」を見る</button><button id="sh">シャッフル</button></div>
<div class="info" id="info"></div>
<div class="bar"><i id="bi"></i></div>
<div id="card"></div>
<div class="ctl"><button id="ok">○ 覚えた</button><button id="pv">◀ 前へ</button><button id="nx">次へ ▶</button></div>
<button id="rs" class="rs">覚えた記録をリセット</button>
<script>
const D=[["BSC（バランススコアカード）", "財務だけに偏らず、顧客・業務プロセス・学習と成長もあわせた4つの視点で、バランスよく経営を評価する手法", 1], ["KGI", "キー ゴール インディケーター。中長期の目標。達成したら、プロダクトの成功", 0], ["CSF", "クリティカル サクセス ファクター。KGIを達成するために必要な要素", 0], ["KPI", "キー パフォーマンス インディケーター。目標を達成するために設定する具体的な数値", 1], ["バリューエンジニアリング（VE）", "製品やサービスに必要な価値を決めてから、コストを削る手法（価値＝機能÷コスト）", 1], ["CRM（カスタマー リレーションシップ マネジメント）", "顧客との関係を強化して、リピーターを増やし、売上を伸ばす仕組み（例：誕生日に割引サービス）", 1], ["SFA（セールス フォース オートメーション）", "営業活動の情報を一元管理して、営業を支援・効率化する仕組み", 1], ["SCM（サプライ チェーン マネジメント）", "原材料の調達から販売まで、モノの流れ（供給の連鎖）を管理して、全体を効率化する手法", 1], ["ERP", "エンタープライズ リソース プランニング。ヒト、モノ、カネを一元管理する。基幹システムともいう", 1], ["準天頂衛星", "日本の衛星測位システム。高精度な位置情報を提供する（みちびき）", 0], ["JIT（ジャストインタイム）", "必要なものを、必要な時に、必要なだけ生産するトヨタ自動車の生産方式。部品のやりとりに、かんばんを使ったのでかんばん方式ともいう", 1], ["リーン生産方式", "JITが、アメリカで製造業以外にも応用されて、一般化したもの", 1], ["スマートファクトリー", "デジタル技術で最適化された生産を行う、次世代の工場", 0], ["FMS", "フレキシブル マニュファクチャリング システム。柔軟な設備。少量多品種生産が可能になる", 1], ["M2M", "マシン トゥ マシン。機械同士の通信", 0], ["コンカレントエンジニアリング", "製品開発の工程を、順番ではなく同時に並行して進めて、開発期間を短縮する手法", 1], ["eKYC（イーケーワイシー）", "エレクトロニック ノウ ユア カスタマー。必要な本人確認を、オンラインで行うこと", 1], ["ブロックチェーン", "すべてのブロックに取引の履歴が記録されていて、データの改ざんが難しい仕組み（ビットコインで有名）", 1], ["オプトインメール", "顧客に、あらかじめ同意を得てから送るメール。「特定電子メール法」で決められている（オプトは「選ぶ」の意味）", 1], ["A/Bテスト", "新たなデザインのWebサイトを実験的に並行稼働し、アクセス数や成約率（コンバージョン率）などを比較・検証する手法", 1], ["ロングテール", "Web販売で、販売機会の少ないニッチな商品の売上合計が、売れ筋のメイン商品を上回る現象（「長いしっぽ」の意味）", 0], ["エスクローサービス", "購入者と販売者の間に入る仲介者が、代金を一時的に預かり、商品の到着を確認してから支払うサービス（フリマ、オークションアプリ）", 1], ["デジタルサイネージ", "ディスプレイなどの電子機器で、情報や広告を表示する看板（電子看板）", 1], ["フリーミアム", "無料（フリー）で基本的な機能を体験でき、気に入ったら有料（プレミアム）で、より充実した機能を使える仕組み", 1]];
let M={};try{M=JSON.parse(localStorage.getItem("itp10_3")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("itp10_3",JSON.stringify(M))}catch(e){}};
let f="all",sh=false,sv=false,L=[],i=0,back=false;
const $=s=>document.querySelector(s);
const vis=k=>sv||!M[D[k][0]];
function nxt(s){for(let n=1;n<=L.length;n++){const j=((i+s*n)%L.length+L.length)%L.length;if(vis(L[j]))return j}return -1}
function build(){L=D.map((_,k)=>k).filter(k=>f=="all"||D[k][2]);
if(sh)for(let k=L.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[L[k],L[j]]=[L[j],L[k]]}
i=0;if(L.length&&!vis(L[0]))i=nxt(1);back=false;render()}
function render(){const c=$("#card"),T=L.length,N=L.filter(k=>!M[D[k][0]]).length,ok=$("#ok");
$("#info").textContent="残り "+N+" 枚 / 全 "+T+" 枚";$("#bi").style.width=(T?(T-N)/T*100:0)+"%";
if(i<0||!T){c.className="";ok.disabled=true;ok.className="";ok.textContent="○ 覚えた";
c.innerHTML="<div id='d'>全部覚えました 🎉</div><div class='hint'>上の［「覚えた」を見る］で復習できます</div>";return}
ok.disabled=false;const d=D[L[i]],on=!!M[d[0]];c.className=d[2]?"vip":"";
ok.className=on?"on":"";ok.textContent=on?"✓ 覚えた（タップで取り消し）":"○ 覚えた";
c.innerHTML=(d[2]?"<span class='badge'>超重要</span>":"")+(back?"<div class='hint' style='margin:0 0 12px'>"+d[0]+"</div><div id='d'>"+d[1]+"</div>":"<div id='t'>"+d[0]+"</div><div class='hint'>タップで解説</div>")}
const go=s=>{if(!L.length)return;i=nxt(s);back=false;render()};
$("#card").onclick=()=>{if(i>=0){back=!back;render()}};
$("#nx").onclick=()=>go(1);$("#pv").onclick=()=>go(-1);
$("#ok").onclick=()=>{if(i<0)return;const t=D[L[i]][0];if(M[t])delete M[t];else M[t]=1;save();render()};
$("#fs").onclick=e=>{const b=e.target.closest("button");if(!b)return;
if(b.id=="sh"){sh=!sh;b.classList.toggle("on",sh)}else if(b.id=="sv"){sv=!sv;b.classList.toggle("on",sv)}else{f=b.dataset.f;document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x==b))}build()};
let x0=0;$("#card").ontouchstart=e=>{x0=e.touches[0].clientX};
$("#card").ontouchend=e=>{const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60){e.preventDefault();go(dx<0?1:-1)}};
$("#rs").onclick=()=>{let ok=false;try{ok=confirm("「覚えた」の記録をすべて消して、最初の順番に戻します。よろしいですか？")}catch(e){}
if(!ok)return;M={};save();f="all";sh=false;sv=false;
document.querySelectorAll("[data-f]").forEach(x=>x.classList.toggle("on",x.dataset.f=="all"));
$("#sh").classList.remove("on");$("#sv").classList.remove("on");build()};
build();
</script></body></html>
